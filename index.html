<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🇧🇷 Arames Brasil | Controle de Produção</title>
    <meta name="theme-color" content="#009C3B">
    
    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, orderBy, query, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyACyY0nvZHyVFottlG7iM2pJ912bO8-_5E",
          authDomain: "controle---estoque.firebaseapp.com",
          databaseURL: "https://controle---estoque-default-rtdb.firebaseio.com",
          projectId: "controle---estoque",
          storageBucket: "controle---estoque.firebasestorage.app",
          messagingSenderId: "10157072339",
          appId: "1:10157072339:web:37a7f7732e4a9224c2d926"
        };

        const app = initializeApp(firebaseConfig);
        window.auth = getAuth(app);
        window.db = getFirestore(app);
        window.signInWithEmailAndPassword = signInWithEmailAndPassword;
        window.onAuthStateChanged = onAuthStateChanged;
        window.signOut = signOut;
        window.collection = collection;
        window.addDoc = addDoc;
        window.query = query;
        window.orderBy = orderBy;
        window.onSnapshot = onSnapshot;
    </script>
    
    <style>
        :root {
            --verde-brasil: #009C3B;
            --verde-escuro: #007A2F;
            --verde-claro: #E6F9ED;
            --amarelo-brasil: #FFDF00;
            --amarelo-escuro: #E6C600;
            --amarelo-claro: #FFFBE6;
            --azul-brasil: #002776;
            --azul-claro: #E6EBF7;
            --branco: #FFFFFF;
            --texto: #1A1A1A;
            --texto-claro: #555555;
            --cinza-borda: #D9D9D9;
            --sombra-suave: 0 2px 8px rgba(0, 156, 59, 0.08);
            --sombra-destaque: 0 4px 16px rgba(0, 156, 59, 0.15);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
        }
        body {
            background: linear-gradient(180deg, var(--verde-claro) 0%, var(--branco) 100%);
            color: var(--texto);
            min-height: 100vh;
            padding: 16px 12px;
        }
        
        /* --- TELA DE LOGIN --- */
        .tela-login {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--verde-brasil) 0%, var(--azul-brasil) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
        }
        .caixa-login {
            background: var(--branco);
            padding: 32px 24px;
            border-radius: 20px;
            border: 4px solid var(--amarelo-brasil);
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .caixa-login h1 {
            color: var(--verde-brasil);
            font-size: 24px;
            margin-bottom: 6px;
        }
        .caixa-login p {
            color: var(--texto-claro);
            font-size: 14px;
            margin-bottom: 24px;
        }
        .caixa-login input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--cinza-borda);
            border-radius: 10px;
            font-size: 15px;
            margin-bottom: 14px;
            transition: all 0.2s;
        }
        .caixa-login input:focus {
            outline: none;
            border-color: var(--verde-brasil);
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--verde-brasil), var(--verde-escuro));
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: transform 0.2s;
        }
        .btn-login:hover {
            transform: translateY(-2px);
        }
        .erro-login {
            color: #D32F2F;
            font-size: 13px;
            margin-top: 12px;
            display: none;
        }
        .carregando {
            color: var(--azul-brasil);
            font-size: 14px;
            margin-top: 12px;
            display: none;
        }
        
        /* --- CONTEÚDO PRINCIPAL --- */
        .conteudo-principal {
            display: none;
        }
        .cabecalho-topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .btn-sair {
            background: var(--amarelo-claro);
            color: var(--azul-brasil);
            border: 2px solid var(--amarelo-brasil);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .usuario-info {
            font-size: 13px;
            color: var(--azul-brasil);
            font-weight: 500;
        }
        
        header {
            text-align: center;
            margin-bottom: 24px;
            padding: 28px 20px;
            background: linear-gradient(135deg, var(--verde-brasil) 0%, var(--verde-escuro) 100%);
            border-radius: 12px;
            border: 4px solid var(--amarelo-brasil);
            box-shadow: var(--sombra-destaque);
        }
        header h1 {
            font-size: 26px;
            font-weight: 900;
            color: var(--amarelo-brasil);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        header p {
            color: var(--branco);
            font-size: 15px;
            margin-top: 6px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        .card {
            background: var(--branco);
            border-radius: 16px;
            border-left: 5px solid var(--verde-brasil);
            box-shadow: var(--sombra-suave);
            padding: 22px;
            margin-bottom: 20px;
        }
        .card-titulo {
            font-size: 18px;
            font-weight: 800;
            color: var(--azul-brasil);
            margin-bottom: 18px;
            padding-bottom: 12px;
            border-bottom: 3px solid var(--amarelo-brasil);
        }
        .grupo-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px 20px;
        }
        .campo label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--azul-brasil);
            margin-bottom: 6px;
        }
        input, select {
            width: 100%;
            padding: 11px 14px;
            border: 2px solid var(--cinza-borda);
            border-radius: 10px;
            font-size: 14px;
            background: var(--branco);
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--verde-brasil);
        }
        .btn {
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            padding: 11px 18px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }
        .btn-principal {
            background: linear-gradient(135deg, var(--verde-brasil) 0%, var(--verde-escuro) 100%);
            color: white;
        }
        .btn-sucesso {
            background: linear-gradient(135deg, var(--amarelo-brasil) 0%, var(--amarelo-escuro) 100%);
            color: var(--azul-brasil);
        }
        .tabela-wrapper {
            overflow-x: auto;
            border: 2px solid var(--amarelo-brasil);
            border-radius: 12px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            background: var(--branco);
        }
        table th, table td {
            padding: 12px 14px;
            text-align: left;
            border-bottom: 1px solid var(--cinza-borda);
        }
        table th {
            background: linear-gradient(to bottom, var(--verde-claro), #D8F3E2);
            font-weight: 800;
            color: var(--azul-brasil);
            border-bottom: 2px solid var(--verde-brasil);
        }
        .rodape-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 3px solid var(--amarelo-brasil);
            flex-wrap: wrap;
            gap: 12px;
        }
        .total-geral {
            font-size: 17px;
            font-weight: 900;
            color: var(--verde-escuro);
        }
        .mensagem {
            padding: 12px 16px;
            border-radius: 10px;
            margin-top: 12px;
            font-size: 13px;
            display: none;
            font-weight: 600;
        }
        .mensagem.sucesso { background: var(--verde-claro); color: var(--verde-escuro); display: block; border: 2px solid var(--verde-brasil); }
        .mensagem.erro { background: #FFEBEE; color: #C62828; display: block; border: 2px solid #EF9A9A; }
        
        @media (max-width: 600px) {
            .grupo-form { grid-template-columns: 1fr; }
            .rodape-card { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>

<!-- 🚪 TELA DE LOGIN -->
<div class="tela-login" id="telaLogin">
    <div class="caixa-login">
        <h1>🇧🇷 Arames Brasil</h1>
        <p>Controle de Produção — Acesso Restrito</p>
        <input type="email" id="campoEmail" placeholder="📧 Digite seu e-mail">
        <input type="password" id="campoSenha" placeholder="🔑 Digite sua senha">
        <button class="btn-login" onclick="fazerLogin()">🔓 Entrar</button>
        <div class="carregando" id="carregando">⏳ Entrando...</div>
        <div class="erro-login" id="erroLogin">❌ E-mail ou senha incorretos</div>
    </div>
</div>

<!-- 📋 CONTEÚDO PRINCIPAL -->
<div class="conteudo-principal" id="conteudoPrincipal">
    <div class="container">
        <div class="cabecalho-topo">
            <span class="usuario-info" id="usuarioLogado"></span>
            <button class="btn-sair" onclick="fazerLogout()">🚪 Sair</button>
        </div>
        
        <header>
            <h1>🇧🇷 Arames Brasil</h1>
            <p>Controle de Produção & Estoque de Estribos</p>
        </header>

        <section class="card">
            <div class="card-titulo">➕ Nova Produção</div>
            <div class="grupo-form">
                <div class="campo">
                    <label>📅 Data</label>
                    <input type="date" id="data">
                </div>
                <div class="campo">
                    <label>📐 Modelo de Estribo</label>
                    <input type="text" id="estribo" placeholder="Ex: 7x14">
                </div>
                <div class="campo">
                    <label>🔩 Bitola (mm)</label>
                    <select id="material">
                        <option value="">Selecione...</option>
                        <option value="3.8">Ø 3,8 mm</option>
                        <option value="4.2">Ø 4,2 mm</option>
                        <option value="5.0">Ø 5,0 mm</option>
                        <option value="6.0">Ø 6,0 mm</option>
                    </select>
                </div>
                <div class="campo">
                    <label>📦 Tipo</label>
                    <select id="tipo">
                        <option value="">Selecione...</option>
                        <option value="AMARRADO">AMARRADO</option>
                        <option value="MLIVRE">M. LIVRE</option>
                        <option value="PACOTE">PACOTE</option>
                    </select>
                </div>
                <div class="campo">
                    <label>Peças por Pacote</label>
                    <input type="number" id="qtdPacote" placeholder="0" min="1">
                </div>
                <div class="campo">
                    <label>Total de Pacotes</label>
                    <input type="number" id="totalPacotes" placeholder="0" min="1">
                </div>
                <div class="campo">
                    <label>👤 Responsável</label>
                    <input type="text" id="responsavel" placeholder="Seu nome">
                </div>
            </div>
            <div style="margin-top: 18px; display: flex; gap: 10px; flex-wrap: wrap;">
                <button class="btn btn-principal" onclick="adicionarProducao()">💾 Salvar Produção</button>
                <button class="btn btn-sucesso" onclick="exportarExcel()">📊 Baixar Excel</button>
            </div>
            <div id="mensagem" class="mensagem"></div>
        </section>

        <section class="card">
            <div class="card-titulo">📊 Produções Registradas</div>
            <div class="tabela-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Modelo</th>
                            <th>Bitola</th>
                            <th>Tipo</th>
                            <th>Pç/Pct</th>
                            <th>Pacotes</th>
                            <th>Total Peças</th>
                            <th>Responsável</th>
                        </tr>
                    </thead>
                    <tbody id="corpoTabela"></tbody>
                </table>
            </div>
            <div class="rodape-card">
                <div class="total-geral" id="totalGeral">🇧🇷 Total de Peças: 0</div>
            </div>
        </section>
    </div>
</div>

<script type="module">
    let listaProducoes = [];
    let unsubscribe = null;

    // Verificar se usuário já está logado
    window.onAuthStateChanged(window.auth, (usuario) => {
        if (usuario) {
            mostrarConteudo(usuario);
            carregarDados();
        } else {
            mostrarLogin();
        }
    });

    window.mostrarLogin = function() {
        document.getElementById('telaLogin').style.display = 'flex';
        document.getElementById('conteudoPrincipal').style.display = 'none';
    };

    window.mostrarConteudo = function(usuario) {
        document.getElementById('telaLogin').style.display = 'none';
        document.getElementById('conteudoPrincipal').style.display = 'block';
        document.getElementById('usuarioLogado').textContent = '✅ Conectado: ' + usuario.email;
        document.getElementById('data').value = new Date().toISOString().split('T')[0];
    };

    window.fazerLogin = async function() {
        const email = document.getElementById('campoEmail').value;
        const senha = document.getElementById('campoSenha').value;
        const erroEl = document.getElementById('erroLogin');
        const carregando = document.getElementById('carregando');
        
        erroEl.style.display = 'none';
        carregando.style.display = 'block';
        
        try {
            await window.signInWithEmailAndPassword(window.auth, email, senha);
        } catch (erro) {
            carregando.style.display = 'none';
            erroEl.style.display = 'block';
            document.getElementById('campoSenha').value = '';
        }
    };

    window.fazerLogout = async function() {
        if (confirm('Tem certeza que deseja sair?')) {
            if (unsubscribe) unsubscribe();
            await window.signOut(window.auth);
        }
    };

    window.adicionarProducao = async function() {
        const usuario = window.auth.currentUser;
        if (!usuario) return;
        
        const dados = {
            data: document.getElementById('data').value,
            estribo: document.getElementById('estribo').value.trim(),
            material: document.getElementById('material').value,
            tipo: document.getElementById('tipo').value,
            qtdPacote: parseInt(document.getElementById('qtdPacote').value) || 0,
            totalPacotes: parseInt(document.getElementById('totalPacotes').value) || 0,
            responsavel: document.getElementById('responsavel').value.trim(),
            totalPecas: (parseInt(document.getElementById('qtdPacote').value) || 0) * (parseInt(document.getElementById('totalPacotes').value) || 0),
            uid: usuario.uid
        };
        
        if (!dados.data || !dados.estribo || !dados.material || !dados.tipo || !dados.qtdPacote || !dados.totalPacotes || !dados.responsavel) {
            return exibirMensagem('⚠️ Preencha todos os campos!', 'erro');
        }
        
        try {
            await window.addDoc(window.collection(window.db, 'producoes'), dados);
            exibirMensagem('✅ Produção salva com sucesso! 🇧🇷', 'sucesso');
            limparCampos();
        } catch (erro) {
            exibirMensagem('❌ Erro ao salvar: ' + erro.message, 'erro');
        }
    };

    window.carregarDados = function() {
        const q = window.query(window.collection(window.db, 'producoes'), window.orderBy('data', 'desc'));
        unsubscribe = window.onSnapshot(q, (snapshot) => {
            listaProducoes = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            atualizarTabela();
        });
    };

    window.atualizarTabela = function() {
        const tb = document.getElementById('corpoTabela');
        tb.innerHTML = '';
        
        if (!listaProducoes.length) {
            tb.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:30px;color:#666;">📭 Nenhuma produção registrada</td></tr>';
            document.getElementById('totalGeral').textContent = '🇧🇷 Total de Peças: 0';
            return;
        }
        
        let totalGeral = 0;
        listaProducoes.forEach(p => {
            totalGeral += p.totalPecas || 0;
            const dataFormatada = p.data ? p.data.split('-').reverse().join('/') : '-';
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${dataFormatada}</strong></td>
                <td>${p.estribo}</td>
                <td>Ø ${p.material} mm</td>
                <td>${p.tipo}</td>
                <td>${p.qtdPacote}</td>
                <td>${p.totalPacotes}</td>
                <td><strong style="color: #007A2F;">${p.totalPecas.toLocaleString('pt-BR')}</strong></td>
                <td>${p.responsavel}</td>
            `;
            tb.appendChild(tr);
        });
        
        document.getElementById('totalGeral').textContent = `🇧🇷 Total de Peças: ${totalGeral.toLocaleString('pt-BR')}`;
    };

    window.exportarExcel = function() {
        if (!listaProducoes.length) return alert('Sem dados para exportar!');
        
        let csv = '\uFEFF"Data";"Modelo";"Bitola";"Tipo";"Peças/Pacote";"Pacotes";"Total Peças";"Responsável"\n';
        listaProducoes.forEach(p => {
            const dataFormatada = p.data ? p.data.split('-').reverse().join('/') : '-';
            csv += `"${dataFormatada}";"${p.estribo}";"${p.material} mm";"${p.tipo}";"${p.qtdPacote}";"${p.totalPacotes}";"${p.totalPecas}";"${p.responsavel}"\n`;
        });
        
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `Arames_Brasil_${new Date().toISOString().split('T')[0]}.csv`;
        a.click();
    };

    function limparCampos() {
        document.getElementById('estribo').value = '';
        document.getElementById('material').value = '';
        document.getElementById('tipo').value = '';
        document.getElementById('qtdPacote').value = '';
        document.getElementById('totalPacotes').value = '';
        document.getElementById('responsavel').value = '';
    }

    function exibirMensagem(texto, tipo) {
        const el = document.getElementById('mensagem');
        el.className = `mensagem ${tipo}`;
        el.textContent = texto;
        setTimeout(() => { el.style.display = 'none'; }, 4000);
    }

    // Permitir login com Enter
    document.addEventListener('keypress', e => {
        if (e.key === 'Enter' && document.getElementById('telaLogin').style.display !== 'none') {
            window.fazerLogin();
        }
    });
</script>

</body>
</html>
